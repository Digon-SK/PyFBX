[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=3.0.1",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyfbx-ufbx"
version = "0.1.0"
description = "A friendly, Pythonic wrapper around ufbx"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PyFBX contributors" }]
keywords = ["fbx", "ufbx", "3d", "mesh", "animation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
test = ["pytest>=8", "numpy>=1.24"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.12", "mypy>=1.16", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/ufbx/ufbx"
Source = "https://github.com/ufbx/ufbx"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/pyfbx"]
sdist.include = [
    "src",
    "tests",
    "examples",
    "third_party/ufbx/ufbx.c",
    "third_party/ufbx/ufbx.h",
    "third_party/ufbx/LICENSE",
    "CMakeLists.txt",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

